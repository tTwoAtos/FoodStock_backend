prometheus:
  image:
    repository: prom/prometheus
    tag: latest
  service:
    type: ClusterIP
    port: 9090
  config:
    scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

grafana:
  image:
    repository: grafana/grafana
    tag: latest
  adminUser: admin
  adminPassword: grafana
  service:
    type: ClusterIP
    port: 3000
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      isDefault: true
      access: proxy
      editable: true

influxdb:
  image:
    repository: influxdb
    tag: latest
  service:
    type: ClusterIP
    port: 8086
  adminUser: admin
  adminPassword: admin
  database: metrics

telegraf:
  image:
    repository: telegraf
    tag: latest
  config: |
    [agent]
      interval = "10s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      debug = false
      quiet = false
      logfile = ""

    [[outputs.influxdb]]
      urls = ["http://influxdb:8086"]
      database = "metrics"
      username = "admin"
      password = "admin"

    [[inputs.cpu]]
      percpu = true
      totalcpu = true
      collect_cpu_time = false
      report_active = false

    [[inputs.mem]]
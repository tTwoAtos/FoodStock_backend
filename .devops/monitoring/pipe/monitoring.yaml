name: Monitoring

on:
  push:
    branches:
      - main
      - master
      - devel
  pull_request:
    branches:
      - main
      - master
      - devel

jobs:
  monitoring:
    runs-on: ubuntu-latest

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: --health-cmd "curl -f http://localhost:9090 || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5

      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
        options: --health-cmd "curl -f http://localhost:3000 || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          GF_SECURITY_ADMIN_PASSWORD: admin

      influxdb:
        image: influxdb:latest
        ports:
          - 8086:8086
        options: --health-cmd "curl -f http://localhost:8086/ping || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          INFLUXDB_DB: metrics
          INFLUXDB_ADMIN_USER: admin
          INFLUXDB_ADMIN_PASSWORD: admin

      telegraf:
        image: telegraf:latest
        depends_on:
          - influxdb
        volumes:
          - /proc:/host/proc:ro
          - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build and test with Gradle
        run: ./gradlew test

      - name: Start Prometheus, Grafana, InfluxDB, and Telegraf
        run: docker-compose up -d
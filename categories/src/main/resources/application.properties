# Read env file
spring.config.import=optional:file:.env[.properties]
# Server port
server.port=4009
#Configure database access
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/foodstock
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Let Spring manage our tabless
spring.jpa.generate-ddl=true
spring.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Eureka config
spring.application.name=CATEGORY-SERVICE
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8787/eureka
eureka.instance.hostname=localhost
# Default Config
spring.jpa.properties.hibernate.jdbc.batch_size=4
spring.jpa.properties.hibernate.order_inserts=true

# Springdoc config
springdoc.version=v1.0

#Security Config
keyStore.path=keystore.jks
keyStore.password=password
keyStore.alias=auth-server
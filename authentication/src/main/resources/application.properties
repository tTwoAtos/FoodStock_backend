# Read env file
spring.config.import=optional:file:.env[.properties]
# Server port
server.port=4005
#Configure database access
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/foodstock
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
#Active log of hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Eureka config
spring.application.name=AUTH-SERVICE
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8787/eureka
eureka.instance.hostname=localhost
# Springdoc config
springdoc.version=v1.0
springdoc.api-docs.url=http://localhost:5000/api/v1
springdoc.swagger-ui.disable-swagger-default-url=true

# security
keyStore.path=keystore.jks
keyStore.password=password
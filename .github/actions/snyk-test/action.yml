name: 'Snyk Test'
description: 'Run Snyk test and log vulnerabilities'
inputs:
  service:
    description: 'Service name'
    required: true
  file:
    description: 'Build file path'
    required: true
  all-sub-projects:
    description: 'Include all sub-projects'
    required: false
    default: "false"
runs:
  using: 'composite'
  steps:
    - name: Run Snyk test for ${{ inputs.service }}
      shell: bash
      run: |
        if [ "${{ inputs.all-sub-projects }}" = "true" ]; then
          snyk test --file=${{ inputs.file }} --all-sub-projects || true
        else
          snyk test --file=${{ inputs.file }} || true
        fi
      continue-on-error: true

    - name: Log vulnerabilities for ${{ inputs.service }}
      shell: bash
      if: always()
      run: |
        if [ "${{ inputs.all-sub-projects }}" = "true" ]; then
          snyk test --file=${{ inputs.file }} --all-sub-projects > snyk-${{ inputs.service }}.log || true
        else
          snyk test --file=${{ inputs.file }} > snyk-${{ inputs.service }}.log || true
        fi